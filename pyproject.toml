[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-analyzer"
version = "1.0.0"
description = "Spotify dataset analysis using Python, Pandas, NumPy and data visualization"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
spotify-analyzer = "spotify_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]